# Local / demo stack. All secrets below are development-only defaults; override them via
# environment variables or a .env file. Never reuse them in a real deployment.

x-app-env: &app-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-insecure-jwt-signing-key-change-me}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-only-webhook-secret-change-me}
  POSTGRES_DB: ${POSTGRES_DB:-eve}
  POSTGRES_USER: ${POSTGRES_USER:-eve}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve-dev-password}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eve}
      POSTGRES_USER: ${POSTGRES_USER:-eve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve-dev-password}
    ports:
      # Bound to localhost only so the dev database isn't exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *app-env
      # Production-like: DEBUG off. Cookies aren't marked Secure because this runs on http.
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_COOKIES: "false"
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      PAYMENT_SIMULATION_DEFAULT_OUTCOME: ${PAYMENT_SIMULATION_DEFAULT_OUTCOME:-SUCCESS}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Run the test suite in a container: docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "-q", "--cov", "--cov-report=term"]

volumes:
  pgdata:
