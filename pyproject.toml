# Tool configuration only. Dependencies live in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "S",   # bandit (security)
    "SIM", # simplify
]
ignore = [
    "S101", # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # hard-coded test passwords/secrets

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
